<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommendation System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #00ffcc;
        }

        input {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #00ffcc;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00ccaa;
        }

        .results {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>🎬 Movie Recommendation System</h1>

    <form method="POST">
        <input type="text" name="movie" placeholder="Enter movie name..." required>
        <br>
        <button type="submit">Recommend</button>
    </form>

    <div class="results">
        {% if recommendations %}
            <h2>Recommended Movies:</h2>
            <ul>
                {% for movie in recommendations %}
                    <li>{{ movie }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>

</body>
</html>
